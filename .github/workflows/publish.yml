# Place this file at .github/workflows/release.yml in the PUBLIC repo (Record10/record-bill)
# Builds are free & unlimited on public repos.
#
# REQUIRED SECRETS (set in Organization Settings → Secrets and variables → Actions):
#   - PRIVATE_REPO_PAT                   : Fine-grained PAT with Contents:Read on Pritraj/Record-Bill
#   - TAURI_SIGNING_PRIVATE_KEY          : Tauri update signing key (~/.tauri/myshapkey.key)
#   - ANDROID_KEYSTORE_BASE64            : Base64-encoded Android keystore
#   - KEY_ALIAS                          : Key alias
#   - GEN_PASSWORD                       : Shared password (keystore, key, signing key)
#
name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (private repo)"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - main
      mac:
        description: "Build macOS desktop"
        type: boolean
        default: true
      windows:
        description: "Build Windows desktop"
        type: boolean
        default: true
      linux:
        description: "Build Linux desktop"
        type: boolean
        default: true
      android:
        description: "Build Android (APK and AAB)"
        type: boolean
        default: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_jobs: ${{ steps.pick.outputs.has_jobs }}
    steps:
      - id: pick
        shell: bash
        run: |
          items=()
          [ "${{ inputs.mac }}" = "true" ] && items+=('{"platform":"macos-latest","target":"desktop"}')
          [ "${{ inputs.windows }}" = "true" ] && items+=('{"platform":"windows-latest","target":"desktop"}')
          [ "${{ inputs.linux }}" = "true" ] && items+=('{"platform":"ubuntu-22.04","target":"desktop"}')
          [ "${{ inputs.android }}" = "true" ] && items+=('{"platform":"ubuntu-latest","target":"android"}')
          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_jobs=false' >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${items[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo 'has_jobs=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}

    steps:
      # ─── Clone source from private repo ───
      - name: Clone private repository
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ inputs.branch }} \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/Pritraj/record-bill.git .

      # ─── Linux desktop system packages ───
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.target == 'desktop'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ─── Common setup ───
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}

      # ─── Android-specific setup ───
      - name: Install Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.target == 'android'
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      # ─── Build frontend ───
      - name: Install frontend dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm install
          else
            npm install
          fi

      - name: Build frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm run build
          else
            npm run build
          fi

      # ─── Read version & config from tauri.conf.json ───
      - name: Get Version
        id: get_version
        shell: bash
        run: |
          TAURI_DIR="src-tauri"
          if [ -d "tauri" ]; then
            TAURI_DIR="tauri"
          fi
          echo "tauri_dir=$TAURI_DIR" >> $GITHUB_OUTPUT
          VERSION=$(grep '"version":' "$TAURI_DIR/tauri.conf.json" | head -n 1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
          echo "Building version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine Release Config
        id: release_config
        shell: bash
        run: |
          if [[ "${{ inputs.branch }}" == "qa" ]]; then
            echo "type=qa" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag=v${{ steps.get_version.outputs.version }}-qa.${{ github.run_number }}" >> $GITHUB_OUTPUT

            # Merge QA config into tauri.conf.json
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install jq -y
            fi
            jq -s '.[0] * .[1]' ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.qa.json > ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.merged.json
            mv ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.merged.json ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json
          else
            echo "type=prod" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag=v${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      # ─── Windows workaround (desktop only) ───
      - name: Workaround for deep-link on Windows (Desktop)
        if: runner.os == 'Windows' && matrix.target == 'desktop'
        shell: bash
        run: |
          # Rename gen/android so tauri-build doesn't try to write tauri.settings.gradle
          # (Windows env vars are case-insensitive, causing os error 3)
          mv ${{ steps.get_version.outputs.tauri_dir }}/gen/android ${{ steps.get_version.outputs.tauri_dir }}/gen/_android_disabled
          # Remove deep-link config to prevent plugin panic on Windows
          jq 'del(.plugins."deep-link")' ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json > ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.temp.json
          mv ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.temp.json ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json

      # ─── Windows workaround (android only) ───
      - name: Remove deep-link config (Android on Windows)
        if: runner.os == 'Windows' && matrix.target == 'android'
        shell: bash
        run: |
          # Remove deep-link config to prevent plugin panic on Windows
          jq 'del(.plugins."deep-link")' ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json > ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.temp.json
          mv ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.temp.json ${{ steps.get_version.outputs.tauri_dir }}/tauri.conf.json

      # ─── Desktop build (macOS, Windows or Linux) ───
      - name: Build Tauri Desktop App
        if: matrix.target == 'desktop'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GEN_PASSWORD }}
        with:
          projectPath: ${{ steps.get_version.outputs.tauri_dir }}
          tagName: ${{ steps.release_config.outputs.tag }}
          releaseName: "App ${{ steps.release_config.outputs.tag }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ steps.release_config.outputs.prerelease }}

      # ─── Decode Android keystore ───
      - name: Decode Android keystore
        if: matrix.target == 'android'
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks

      # ─── Android build (produces unsigned APK & AAB) ───
      - name: Build Android
        if: matrix.target == 'android'
        shell: bash
        run: |
          TAURI_DIR="src-tauri"
          TAURI_BIN="node_modules/.bin/tauri"
          if [ -d "tauri" ]; then
            TAURI_DIR="tauri"
            TAURI_BIN="../frontend/node_modules/.bin/tauri"
          fi
          cd "$TAURI_DIR"
          if [ -f "$TAURI_BIN" ]; then
            "$TAURI_BIN" android build --target aarch64
          else
            npx tauri android build --target aarch64
          fi
          mkdir -p ../build-artifacts
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      # ─── Sign APK ───
      - name: Sign APK
        if: matrix.target == 'android'
        shell: bash
        run: |
          UNSIGNED_APK=$(find ${{ steps.get_version.outputs.tauri_dir }}/gen/android -name "*.apk" -path "*release*" 2>/dev/null | head -1)
          echo "Found APK: $UNSIGNED_APK"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"
          ${BUILD_TOOLS_DIR}/zipalign -v 4 "$UNSIGNED_APK" /tmp/app-aligned.apk
          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks /tmp/upload-keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.GEN_PASSWORD }}" \
            --key-pass "pass:${{ secrets.GEN_PASSWORD }}" \
            --out build-artifacts/app-release.apk \
            /tmp/app-aligned.apk

      # ─── Sign AAB ───
      - name: Sign AAB
        if: matrix.target == 'android'
        shell: bash
        run: |
          UNSIGNED_AAB=$(find ${{ steps.get_version.outputs.tauri_dir }}/gen/android -name "*.aab" -path "*release*" 2>/dev/null | head -1)
          echo "Found AAB: $UNSIGNED_AAB"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/upload-keystore.jks \
            -storepass "${{ secrets.GEN_PASSWORD }}" \
            -keypass "${{ secrets.GEN_PASSWORD }}" \
            "$UNSIGNED_AAB" "${{ secrets.KEY_ALIAS }}"
          cp "$UNSIGNED_AAB" build-artifacts/app-release.aab

      - name: Upload Android builds to GitHub Release
        if: matrix.target == 'android'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_config.outputs.tag }}
          files: |
            build-artifacts/app-release.apk
            build-artifacts/app-release.aab
